<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image2strokes · 图片转逐笔绘画过程</title>
<meta name="description" content="上传一张图片，自动提炼出逐笔绘制的过程并回放：每一笔都是纯色，允许互相覆盖，成品与原图几乎一致。全程在你的浏览器里完成。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png" sizes="180x180">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)">
<style>
  /* 刻度与主站一致：圆角 16→12→8→4 嵌套，控件 36/32 两档，标签用等宽小字 */
  :root{
    --bg:#f7f6f3; --panel:#fff; --panel-2:#fcfbf9; --inset:#f1efeb;
    --ink:#22242a; --ink-2:#5f636d; --ink-3:#8b8f99;
    --line:#e5e3de; --line-2:#d6d3cc;
    --accent:#c8532f; --accent-2:#e3a17f; --accent-soft:#fdf4f0; --accent-line:#eccbbd;
    --r-lg:16px; --r-md:12px; --r-sm:8px; --r-pill:999px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131417; --panel:#1b1d21; --panel-2:#202328; --inset:#24272c;
      --ink:#e9e7e3; --ink-2:#a4a8b2; --ink-3:#7b808a;
      --line:#2c2f35; --line-2:#3c4048;
      --accent:#e2703a; --accent-2:#8f4526; --accent-soft:#2a1d17; --accent-line:#5c3524;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  a{color:inherit}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;
    border-bottom:1px solid var(--line);}
  .mark{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:15px;
    font-weight:600;letter-spacing:-.01em}
  .mark i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
  .top .spacer{flex:1}
  .icon-btn{display:grid;place-items:center;width:36px;height:36px;padding:0;
    border:1px solid var(--line);border-radius:var(--r-pill);background:var(--panel);
    color:var(--ink-2);cursor:pointer;transition:border-color .16s var(--ease),color .16s var(--ease)}
  .icon-btn:hover{border-color:var(--line-2);color:var(--ink)}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- 骨架：桌面左栏右画面，窄屏改成 选图 → 画面 → 参数 ---------- */
  .wrap{display:grid;grid-template-columns:300px minmax(0,1fr);
    grid-template-areas:"pick board" "params board";gap:16px;
    padding:24px;max-width:1440px;margin:0 auto;align-items:start}
  .side{display:contents}      /* 让三张卡片直接落到下面的网格区域，不必重排 DOM */
  .pick{grid-area:pick}
  .params{grid-area:params}
  .board{grid-area:board;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
  .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink-3);margin:0 0 10px}

  /* ---------- 选图 ---------- */
  #drop{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:20px 12px;
    text-align:center;color:var(--ink-3);cursor:pointer;background:var(--panel-2);
    transition:border-color .16s var(--ease),color .16s var(--ease),background .16s var(--ease)}
  #drop b{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
  #drop span{font-size:12px}
  #drop:hover,#drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  #drop:hover b{color:var(--accent)}
  #drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #drop.busy{opacity:.5;cursor:progress}
  .note{display:none;margin:8px 0 0;font-size:12.5px;line-height:1.5}
  .note.show{display:block}
  .note.err{color:#c0342b}
  .note.warn{color:#9a6b00}
  @media (prefers-color-scheme: dark){ .note.err{color:#ef8478} .note.warn{color:#d8b25e} }
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chips button{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-pill);
    background:var(--panel);color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer;
    transition:border-color .16s var(--ease),color .16s var(--ease)}
  .chips button:hover:not(:disabled){border-color:var(--line-2);color:var(--ink)}
  .chips button:disabled{opacity:.45;cursor:progress}
  .chips button:focus-visible,#phases span:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- 参数 ---------- */
  .row{display:flex;align-items:center;gap:10px;min-height:32px;margin-top:10px;font-size:13px;color:var(--ink-2)}
  .row:first-of-type{margin-top:0}
  .row>span:first-child{width:64px;flex:none;color:var(--ink-3);font-size:12.5px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
  select{flex:1;min-width:0;height:32px;padding:0 8px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;
    transition:border-color .16s var(--ease)}
  select:hover{border-color:var(--line-2)}
  #speedVal{width:44px;flex:none;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
  .toggles{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  label.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  input[type=checkbox]{accent-color:var(--accent)}
  .keys{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
    font-size:11.5px;line-height:2;color:var(--ink-3)}
  .keys kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel-2);
    padding:0 4px;font-family:var(--mono);font-size:11px}

  /* ---------- 舞台 ---------- */
  .stage{display:none}
  .barwrap{height:4px;background:var(--inset);border-radius:var(--r-pill);overflow:hidden}
  #bar,#fill{height:100%;width:0;background:var(--accent)}
  #bar{transition:width .2s var(--ease)}
  #status{margin-top:8px;font-size:12.5px;color:var(--ink-3)}
  #canvasWrap{display:none}
  #cv{display:block;margin:0 auto;background:#fff;border:1px solid var(--line);
    border-radius:var(--r-md);box-shadow:0 10px 28px rgba(40,35,30,.08)}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  button.primary{height:36px;padding:0 16px;border:1px solid var(--accent);border-radius:var(--r-sm);
    background:var(--accent);color:#fff;font:inherit;font-size:13.5px;cursor:pointer;
    transition:filter .16s var(--ease)}
  button.primary:hover{filter:brightness(1.08)}
  button.ghost{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--panel);color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer;
    transition:border-color .16s var(--ease),color .16s var(--ease)}
  button.ghost:hover:not(:disabled){border-color:var(--line-2);color:var(--ink)}
  button.ghost:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-3);min-width:82px}
  .seek{flex:1;min-width:140px;accent-color:var(--accent)}
  .phases{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  #phases span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);cursor:pointer;
    border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 10px;background:var(--panel);
    transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease)}
  #phases span.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  #phases span.done{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
  #stat{margin-top:12px;font-size:13px;color:var(--ink-2)}
  #stat em{font-style:normal;color:var(--accent);font-weight:600}
  #expMsg{font-size:12px;color:var(--ink-3)}

  /* ---------- 空状态 ---------- */
  #welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    min-height:340px;text-align:center;padding:24px}
  #welcome .ic{color:var(--line-2)}
  #welcome p{margin:0}
  #welcome .t{font-size:15px;color:var(--ink-2)}
  #welcome .s{font-size:12.5px;color:var(--ink-3)}

  /* ---------- 页脚 ---------- */
  .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;
    padding:4px 24px 28px;font-size:12px;color:var(--ink-3)}
  .foot a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .foot a:hover{color:var(--accent);border-bottom-color:var(--accent)}

  /* ---------- 整页拖放提示层 ---------- */
  #dropMask{position:fixed;inset:0;z-index:50;display:none;place-items:center;pointer-events:none;
    border:2px dashed var(--accent);background:rgba(200,83,47,.07);
    color:var(--accent);font-size:16px;font-weight:600}
  #dropMask.on{display:grid}

  /* ---------- 各尺寸兼容 ---------- */
  @media (max-width:1180px){ .wrap{grid-template-columns:272px minmax(0,1fr);gap:14px;padding:18px} }
  @media (max-width:900px){
    .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"pick" "board" "params";
      padding:16px;gap:12px}
    .top{padding:0 16px}
    #welcome{min-height:240px}
  }
  @media (max-width:430px){
    .wrap{padding:12px}
    .card{padding:12px;border-radius:var(--r-md)}
    .row>span:first-child{width:52px}
    .toolbar{gap:8px}
    .seek{flex:1 1 100%;order:5}          /* 进度条单独一行，读数与按钮不挤 */
    .foot{padding:4px 12px 22px}
  }
  @media (max-height:620px){ #welcome{min-height:150px} .wrap{padding-top:14px} }
  @media (hover:none){ .keys{display:none} }              /* 没有键盘的设备不显示快捷键说明 */
  @media (pointer:coarse){ button.ghost,button.primary,.chips button,#phases span{min-height:40px} }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="top">
  <span class="mark"><i aria-hidden="true"></i>image2strokes</span>
  <span class="spacer"></span>
  <a class="icon-btn" href="https://github.com/longguanhong0755/image2strokes" target="_blank" rel="noopener"
     title="在 GitHub 查看源码" aria-label="在 GitHub 查看源码">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" stroke="none" d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.09.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.57 2.34 1.12 2.91.85.09-.66.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.49A10.03 10.03 0 0 0 22 12.25C22 6.58 17.52 2 12 2Z"/>
    </svg>
  </a>
</div>

<div class="wrap">
  <div class="side">
    <div class="card pick">
      <p class="lbl">选图</p>
      <div id="drop" role="button" tabindex="0" aria-label="点击选择图片，或把图片拖进来">
        <b>点击 · 拖入 · 粘贴</b>
        <span>JPG / PNG / WEBP · 长边 ≤ 1024</span>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <p id="note" class="note" role="status" aria-live="polite"></p>
      <div class="chips" id="samples">
        <button data-sample="samples/sample-1.jpg">插画</button>
        <button data-sample="samples/sample-2.jpg">照片</button>
        <button data-sample="samples/sample-3.jpg">海报</button>
      </div>
    </div>

    <div class="card params">
      <p class="lbl">参数</p>
      <div class="row">
        <span>颜色数</span>
        <select id="colors">
          <option value="0" selected>自动（按图片判断）</option>
          <option value="16">16 · 简笔</option>
          <option value="24">24 · 标准</option>
          <option value="32">32 · 细腻</option>
          <option value="40">40 · 照片</option>
        </select>
      </div>
      <div class="row">
        <span>笔触</span>
        <select id="style">
          <option value="marker" selected>平涂马克笔</option>
          <option value="pencil">铅笔速写</option>
          <option value="oil">油画厚涂</option>
        </select>
      </div>
      <div class="row">
        <span>时长</span>
        <select id="detail">
          <option value="0">快看 · 2 分钟</option>
          <option value="1" selected>标准 · 4 分钟</option>
          <option value="2">慢工 · 8 分钟</option>
        </select>
      </div>
      <div class="row">
        <span>速度</span>
        <input id="speed" type="range" min="0.25" max="4" step="0.25" value="2" aria-label="播放速度">
        <span id="speedVal">2×</span>
      </div>
      <div class="toggles">
        <label class="chk"><input id="tip" type="checkbox" checked> 笔尖</label>
        <label class="chk"><input id="guideChk" type="checkbox" checked> 运笔线</label>
        <label class="chk"><input id="cmp" type="checkbox"> 对比原图</label>
      </div>
      <div class="keys">
        <kbd>空格</kbd> 播放 · <kbd>←</kbd><kbd>→</kbd> 跳转 · <kbd>↑</kbd><kbd>↓</kbd> 调速
        · <kbd>O</kbd> 对比 · <kbd>T</kbd> 笔尖 · <kbd>G</kbd> 运笔线 · <kbd>End</kbd> 成品
      </div>
    </div>
  </div>

  <div class="card board">
    <div id="stage" class="stage">
      <div class="barwrap"><div id="bar"></div></div>
      <div id="status">正在提炼…</div>
    </div>
    <div id="canvasWrap">
      <canvas id="cv" width="1024" height="1024"></canvas>
      <div class="toolbar">
        <button id="play" class="primary">暂停</button>
        <button id="toEnd" class="ghost" title="直接快进到画完">看成品</button>
        <span id="clock">0:00 / 0:00</span>
        <input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度" title="拖动定位">
      </div>
      <div class="barwrap" style="margin-top:8px"><div id="fill"></div></div>
      <div class="phases" id="phases" title="点一下跳到该阶段">
        <span data-ph="0">① 起稿</span><span data-ph="1">② 铺色</span><span data-ph="2">③ 收形</span><span data-ph="3">④ 点睛</span>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <button id="expVideo" class="ghost" disabled title="把整段过程录成 WebM">导出视频</button>
        <button id="expJson" class="ghost" disabled title="导出笔触脚本（含裁剪掩膜）">导出笔触</button>
        <button id="expPng" class="ghost" disabled title="保存成品图">存成品图</button>
        <span id="expMsg"></span>
      </div>
      <div id="stat"></div>
    </div>
    <div id="welcome">
      <svg class="ic" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l4.5-4.5 3.5 3.5 3-3L21 16"/>
        <circle cx="15.5" cy="8" r="1.4"/><path d="M8 21h8"/>
      </svg>
      <p class="t">选一张图，看它被一笔一笔画出来</p>
      <p class="s">每一笔都是纯色 · 全程在浏览器里完成</p>
    </div>
  </div>
</div>

<p class="foot">
  <span>图片不出本机</span><span aria-hidden="true">·</span>
  <a href="https://loongsite.com/projects/image2strokes">算法说明与实测数据</a>
</p>

<div id="dropMask" aria-hidden="true"><span>松手即可上传</span></div>

<script src="js/app.js?v=24"></script>
</body>
</html>
